# Office CI (OFF-001).
# Validates the repository toolchain on every push and pull request by
# running the same four quality commands that run locally:
# lint, typecheck, test, test:architecture — on pnpm (version pinned by the
# `packageManager` field in package.json) and Node.js 22.
#
# OFF-004: the test gates run against a real PostgreSQL 17 service container.
# DATABASE_URL points the persistence integration harness (CI mode) at it;
# the harness never touches the referenced database directly — it creates an
# isolated scratch database per run on the same server.
name: CI

on:
  - push
  - pull_request

jobs:
  toolchain:
    name: "Toolchain gates (lint / typecheck / test / architecture)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://office:office@localhost:5432/office_test

      - name: Architecture tests
        run: pnpm test:architecture
        env:
          DATABASE_URL: postgres://office:office@localhost:5432/office_test
