# Office pnpm workspace (OFF-001).
# Workspace layout: apps/* and packages/*
# (see docs/superpowers/plans/2026-09-12-office-architecture-implementation.md
# for the authoritative directory structure).
packages:
  - "apps/*"
  - "packages/*"
  # OFF-007 (pre-approved additive widening): the domain packages live one
  # level deeper (packages/domain/<module>). Additive only — the existing
  # globs above are untouched and remain authoritative for their trees.
  - "packages/domain/*"
  # OFF-013 (additive widening, mirroring the OFF-007 pattern): the
  # intelligence packages live one level deeper too
  # (packages/intelligence/<module>). Additive only — existing globs above
  # are untouched; without this glob pnpm does not link the package's
  # workspace dependencies and the root vitest run cannot resolve them.
  - "packages/intelligence/*"
# OFF-004: allow the embedded-postgres platform package to run its postinstall
# (binary symlink hydration). pnpm 11+ reads build approvals from this file's
# `allowBuilds` — the package.json `pnpm.onlyBuiltDependencies` field is
# silently ignored — and `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS
# without an explicit approval.
allowBuilds:
  '@embedded-postgres/linux-x64': true
